<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="備課卡片">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2f6b5a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>備課卡片</title>
  <link rel="stylesheet" href="css/style.css">
  <style id="print-page"></style>
</head>
<body>

<!-- 筆記列表 -->
<section id="home">
  <header class="home-head">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="36" height="36">
      <h1>備課卡片</h1>
    </div>
    <div class="home-actions">
      <button id="btn-import" class="btn">匯入備份</button>
      <button id="btn-new-board" class="btn primary">＋ 新增筆記</button>
    </div>
  </header>
  <p id="home-empty" class="home-empty" hidden>還沒有筆記。按「＋ 新增筆記」開始備課。</p>
  <div id="board-list" class="board-list"></div>
  <p class="home-foot">所有筆記和照片都只存在這台設備上。換設備或清除瀏覽器資料前，請先用「⋯ › 備份成檔案」。</p>
</section>

<!-- 畫布 -->
<section id="board" hidden>
  <header class="topbar">
    <button id="btn-home" class="tb" title="回到筆記列表">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span>筆記</span>
    </button>
    <button id="board-title" class="board-title" title="點一下改名"></button>
    <div class="tb-group">
      <button id="btn-text" class="tb" title="新增文字卡">
        <svg viewBox="0 0 24 24"><path d="M4 6h11M9.5 6v12M15 15h6M18 12v6"/></svg><span>文字卡</span>
      </button>
      <button id="btn-batch" class="tb" title="一次新增多張文字卡">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="3" y="13" width="8" height="7" rx="1.5"/><path d="M17 14v6M14 17h6"/></svg><span>批次</span>
      </button>
      <button id="btn-camera" class="tb accent" title="拍照（每拍一張就新增一張卡片）">
        <svg viewBox="0 0 24 24"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.3l1.7-2.5h7l1.7 2.5h2.3A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg><span>拍照</span>
      </button>
      <button id="btn-pen" class="tb" title="手寫（Apple Pencil 或手指）">
        <svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L16.4 4.2a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M14.5 6l3.5 3.5"/></svg><span>手寫</span>
      </button>
      <button id="btn-photos" class="tb" title="從相簿選照片">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg><span>相簿</span>
      </button>
    </div>
    <div class="tb-group">
      <button id="btn-undo" class="tb" title="復原" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>復原</span>
      </button>
      <button id="btn-redo" class="tb" title="重做" disabled>
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span>重做</span>
      </button>
      <button id="btn-export" class="tb" title="匯出">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span>匯出</span>
      </button>
    </div>
  </header>

  <div id="viewport">
    <div id="world">
      <svg id="links" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="cards"></div>
      <svg id="ink-layer" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="crumbs" hidden></div>
    <div id="hint" hidden></div>
    <div id="empty-hint" hidden></div>
    <div id="float-toolbar" hidden></div>
    <div class="zoom-ctrl">
      <button id="zoom-out" aria-label="縮小"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" aria-label="放大"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
      <button id="zoom-fit" aria-label="顯示全部" title="顯示全部"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
</section>

<!-- 相機 -->
<div id="camera" class="overlay" hidden>
  <video id="cam-video" playsinline muted autoplay></video>
  <div id="cam-flash"></div>
  <div class="cam-top">
    <button id="cam-close" class="round" aria-label="關閉相機"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="cam-info"><span id="cam-dest"></span><span id="cam-count"></span></div>
    <button id="cam-done" class="pill">完成</button>
  </div>
  <div id="cam-error" hidden>
    <p id="cam-error-text"></p>
    <div class="cam-error-actions">
      <button id="cam-system" class="btn primary">用系統相機拍</button>
      <button id="cam-album2" class="btn">從相簿選</button>
    </div>
  </div>
  <div class="cam-bottom">
    <button id="cam-album" class="cam-side" aria-label="從相簿選">
      <img id="cam-thumb" alt="" hidden>
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg>
    </button>
    <button id="cam-shutter" aria-label="拍照"></button>
    <button id="cam-switch" class="cam-side" aria-label="切換前後鏡頭">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 12a8 8 0 0 1-13.7 5.6L4 15"/><path d="M20 4v5h-5M4 20v-5h5"/></svg>
    </button>
  </div>
</div>

<!-- 全螢幕檢視 -->
<div id="viewer" class="overlay" hidden>
  <div id="viewer-stage"></div>
  <button id="viewer-close" class="round" aria-label="關閉"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button id="viewer-pen" class="round" aria-label="在這張卡片上手寫" title="手寫"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L16.4 4.2a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M14.5 6l3.5 3.5"/></svg></button>
  <button id="viewer-prev" class="round nav" aria-label="上一張"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button id="viewer-next" class="round nav" aria-label="下一張"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <div id="viewer-count"></div>
</div>

<!-- 裁切旋轉 -->
<div id="editor" class="overlay" hidden>
  <div class="editor-bar">
    <button id="editor-cancel" class="btn">取消</button>
    <div class="editor-tools">
      <button id="editor-rotl" class="btn">⟲ 左轉</button>
      <button id="editor-rotr" class="btn">右轉 ⟳</button>
      <button id="editor-reset" class="btn">不裁切</button>
    </div>
    <button id="editor-apply" class="btn primary">套用</button>
  </div>
  <div id="editor-stage">
    <canvas id="editor-canvas"></canvas>
    <div id="crop-box">
      <span data-h="nw"></span><span data-h="ne"></span><span data-h="sw"></span><span data-h="se"></span>
    </div>
  </div>
  <p class="editor-tip">拖拉四個角調整範圍，拖拉中間移動</p>
</div>

<div id="pen-bar" hidden></div>
<div id="dialog" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print-area"><img id="print-img" alt=""></div>

<input type="file" id="file-capture" class="file-input" accept="image/*" capture="environment">
<input type="file" id="file-pick" class="file-input" accept="image/*" multiple>
<input type="file" id="file-backup" class="file-input" accept=".json,application/json">

<script type="module" src="js/main.js"></script>
</body>
</html>
